version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: diplom_db
      POSTGRES_USER: django_user
      POSTGRES_PASSWORD: django_password
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env  # ← ЗАГРУЖАЕМ ПЕРЕМЕННЫЕ ИЗ .env
    environment:
      # Переопределяем некоторые переменные для Docker
      - DB_HOST=db  # В Docker используем имя сервиса
      - DB_NAME=diplom_db
      - DB_USER=django_user
      - DB_PASSWORD=django_password
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - CELERY_TASK_ALWAYS_EAGER=False
    depends_on:
      - db
      - redis

  celery:
    build: .
    command: celery -A backend worker --loglevel=info --pool=solo
    volumes:
      - .:/app
    env_file:
      - .env  # ← ЗАГРУЖАЕМ ПЕРЕМЕННЫЕ ИЗ .env
    environment:
      # Переопределяем некоторые переменные для Docker
      - DB_HOST=db  # В Docker используем имя сервиса
      - DB_NAME=diplom_db
      - DB_USER=django_user
      - DB_PASSWORD=django_password
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - CELERY_TASK_ALWAYS_EAGER=False
    depends_on:
      - redis
      - db

volumes:
  postgres_data:
  redis_data:
